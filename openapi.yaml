openapi: 3.0.3
info:
  title: market4u API
  version: 1.0.0
  description: API RESTful para gestão de produtos, vendas e margem.
servers: [{url: https://your-project.supabase.co/functions/v1}]
security: [{bearerAuth: []}]
paths:
  /api/products:
    get:
      summary: Lista produtos com busca e filtros
      parameters: [{name: search, in: query, schema: {type: string}}, {name: category, in: query, schema: {type: string}}]
      responses: {'200': {description: Produtos, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Product'}}}}}}
    post:
      summary: Cadastra produto
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProductInput'}}}}
      responses: {'201': {description: Criado}}
  /api/sales:
    post:
      summary: Registra venda e baixa estoque atomicamente
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [product_id, quantity], properties: {product_id: {type: string, format: uuid}, quantity: {type: integer, minimum: 1}}}}}}
      responses: {'201': {description: Venda criada}, '409': {description: Estoque insuficiente}}
  /api/analytics/profit:
    get:
      summary: Comparativo de faturamento, CMV e lucro
      parameters: [{name: from, in: query, required: true, schema: {type: string, format: date}}, {name: to, in: query, required: true, schema: {type: string, format: date}}, {name: category, in: query, schema: {type: string}}]
      responses: {'200': {description: Série financeira}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
  schemas:
    ProductInput: {type: object, required: [name, sku, category, stock, cost_price, sale_price], properties: {name: {type: string, maxLength: 160}, sku: {type: string}, category: {type: string}, stock: {type: integer, minimum: 0}, cost_price: {type: number, minimum: 0}, sale_price: {type: number, minimum: 0}}}
    Product: {allOf: [{$ref: '#/components/schemas/ProductInput'}, {type: object, properties: {id: {type: string, format: uuid}, market_id: {type: string, format: uuid}}}]}
